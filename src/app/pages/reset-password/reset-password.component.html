<div class="login-wrapper">
  <!-- Dynamic Glowing Background Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>

  <div class="login-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-icon-wrapper">
        <i class="pi pi-lock"></i>
      </div>
      <h1 class="brand-name">ProFlow</h1>
      <p class="brand-subtitle">Procurement &amp; Production Portal</p>
    </div>

    <!-- Reset Password Card -->
    <div class="login-card glass-panel animate-fade-in">
      <!-- Back Button -->
      <button type="button" class="btn-back-login" (click)="router.navigate(['/forgot-password'])">
        <i class="pi pi-arrow-left"></i> Back
      </button>

      <h2 class="card-title">Set New Password</h2>
      <p class="step-description">Reset password for <strong style="color:#ffffff;">{{ email }}</strong>.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <!-- New Password -->
        <div class="form-field">
          <label class="field-label">New Password</label>
          <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input
              type="password"
              formControlName="newPassword"
              class="login-control"
              placeholder="••••••••"
              [class.has-error]="form.get('newPassword')?.touched && form.get('newPassword')?.errors"
            />
          </div>
          <span class="field-error-msg" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['required']">
            <i class="pi pi-exclamation-circle"></i> Password is required
          </span>
          <span class="field-error-msg" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['minlength']">
            <i class="pi pi-exclamation-circle"></i> Password must be at least 6 characters
          </span>
        </div>

        <!-- Confirm Password -->
        <div class="form-field">
          <label class="field-label">Confirm Password</label>
          <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input
              type="password"
              formControlName="confirmPassword"
              class="login-control"
              placeholder="••••••••"
              [class.has-error]="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']"
            />
          </div>
          <span class="field-error-msg" *ngIf="form.get('confirmPassword')?.touched && form.errors?.['passwordMismatch']">
            <i class="pi pi-exclamation-circle"></i> Passwords do not match
          </span>
        </div>

        <!-- Error Alert -->
        <div class="login-alert alert-danger" *ngIf="error">
          <i class="pi pi-exclamation-triangle"></i>
          <span>{{ error }}</span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="button" class="btn-ghost-dark" (click)="router.navigate(['/forgot-password'])">Cancel</button>
          <button type="submit" class="btn-login-submit" [disabled]="loading">
            <span *ngIf="!loading">Save Password</span>
            <span class="spinner-loading" *ngIf="loading">
              <i class="pi pi-spin pi-spinner"></i> Saving...
            </span>
          </button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <p>&copy; {{ currentYear }} ProFlow Systems. All rights reserved.</p>
    </div>
  </div>
</div>
