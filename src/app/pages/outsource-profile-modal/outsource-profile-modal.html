<div class="modal-header">
  <span class="modal-title">Company Info — {{ userName }}</span>
  <button class="modal-close" (click)="close()">&times;</button>
</div>

<div class="modal-body">
  <!-- @if (fetching) {
  <div class="empty">Loading company data...</div>
  } @else { -->
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-grid">
    <div class="form-group">
      <label for="companyName">Company Name *</label>
      <input id="companyName" type="text" formControlName="companyName" placeholder="Enter company name"
        class="form-control" />
      @if (form.get('companyName')?.invalid && form.get('companyName')?.touched) {
      <span class="text-danger" style="font-size:11px; margin-top:2px;">Company name is required</span>
      }
    </div>

    <div class="form-group">
      <label for="location">Location *</label>
      <input id="location" type="text" formControlName="location" placeholder="Enter location" class="form-control" />
      @if (form.get('location')?.invalid && form.get('location')?.touched) {
      <span class="text-danger" style="font-size:11px; margin-top:2px;">Location is required</span>
      }
    </div>
  </form>

  @if (errorMessage) {
  <div class="alert alert-error" style="margin-top: 16px;">
    {{ errorMessage }}
  </div>
  }

  <div class="form-actions">
    <button type="button" class="btn btn-ghost" (click)="close()">Cancel</button>
    <button type="button" class="btn btn-primary" [disabled]="loading || form.invalid" (click)="onSubmit()">
      {{ loading ? 'Saving...' : 'Save' }}
    </button>
  </div>
  <!-- } -->
</div>
